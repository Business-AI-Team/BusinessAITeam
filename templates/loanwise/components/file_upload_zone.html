{% load i18n %}
{# Reusable document upload: PDF + images. Requires Alpine + static/js/loanwise_file_upload.js #}
<div
  class="rounded-2xl border border-dashed border-slate-300 bg-slate-50/80 p-4 transition dark:border-slate-600 dark:bg-slate-900/40"
  :class="dragOver ? 'border-sky-500 bg-sky-50/50 dark:border-sky-500' : ''"
  x-data="loanwiseFileUpload({
    appId: {{ lw_upload_app_id }},
    showRequirement: {{ lw_upload_show_requirement|yesno:'true,false' }},
    showKind: {{ lw_upload_show_kind|yesno:'true,false' }},
    defaultKind: '{{ lw_upload_default_kind|default:"generic" }}'
  })"
  x-init="loadRequirements(); $nextTick(() => { if ($refs.fileInput) bindFileInput($refs.fileInput); })"
  @dragover.prevent="dragOver = true"
  @dragleave.prevent="dragOver = false"
  @drop.prevent="onDrop($event)"
>
  <input type="file" class="hidden" x-ref="fileInput" accept="{{ lw_upload_accept|default:'.pdf,.png,.jpg,.jpeg,.webp,image/*,application/pdf' }}"
         @change="onFileChosen($event)">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <p class="text-sm font-medium text-slate-800 dark:text-slate-100">{% trans "Add a file" %}</p>
      <p class="text-xs text-slate-500">{% trans "PDF or image — drag & drop or choose a file." %}</p>
    </div>
    <button type="button" @click="openPicker()" :disabled="uploading"
            class="shrink-0 rounded-xl bg-sky-600 px-4 py-2 text-xs font-semibold text-white hover:bg-sky-500 disabled:opacity-50">
      <span x-show="!uploading">{% trans "Choose file" %}</span>
      <span x-show="uploading" x-cloak>{% trans "Uploading…" %}</span>
    </button>
  </div>
  <div class="mt-3" x-show="showRequirement">
    <label class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-400">{% trans "Requirement" %}</label>
    <select x-model="requirementId" class="w-full rounded-lg border border-slate-200 bg-white px-2 py-2 text-sm dark:border-slate-700 dark:bg-slate-950">
      <option value="">{% trans "— optional —" %}</option>
      <template x-for="r in requirements" :key="r.id">
        <option :value="r.id" x-text="r.label"></option>
      </template>
    </select>
  </div>
  <div class="mt-3" x-show="showKind">
    <label class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-400">{% trans "Document type" %}</label>
    <select x-model="docKind" class="w-full rounded-lg border border-slate-200 bg-white px-2 py-2 text-sm dark:border-slate-700 dark:bg-slate-950">
      <option value="generic">{% trans "generic" %}</option>
      <option value="identity">{% trans "identity" %}</option>
      <option value="address">{% trans "address" %}</option>
      <option value="income">{% trans "income" %}</option>
    </select>
  </div>
  <p class="mt-2 text-xs text-rose-600 dark:text-rose-400" x-show="error" x-text="error"></p>
</div>
