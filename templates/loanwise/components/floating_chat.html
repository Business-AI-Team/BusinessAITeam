{% load i18n %}
<div class="fixed bottom-5 right-5 z-[100]" x-data="loanwiseChat({% if lw_chat_app_id %}{{ lw_chat_app_id }}{% else %}null{% endif %})" x-cloak>
  <button type="button" @click="open = !open"
          class="flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-br from-sky-500 to-indigo-600 text-2xl text-white shadow-lg ring-4 ring-white/30 transition hover:scale-105 dark:ring-slate-900/40"
          aria-label="{% trans 'Open assistant' %}">
    💬
  </button>
  <div x-show="open" x-transition
       class="absolute bottom-16 right-0 flex w-[min(100vw-2rem,24rem)] flex-col rounded-2xl border border-slate-200 bg-white shadow-2xl dark:border-slate-700 dark:bg-slate-900"
       style="max-height: 75vh;">
    <div class="border-b border-slate-200 px-4 py-3 dark:border-slate-700">
      <p class="text-sm font-semibold text-slate-900 dark:text-white">{% trans "LoanWise assistant" %}</p>
      <p class="mt-0.5 text-xs text-slate-500 dark:text-slate-400">{% trans "Ask why a decision was made or how to improve your application." %}</p>
    </div>
    <div class="flex-1 overflow-y-auto px-4 py-3 space-y-3 text-sm" x-ref="messages"></div>
    <div class="border-t border-slate-200 p-3 dark:border-slate-700">
      <textarea
        x-model="input"
        rows="2"
        placeholder="{% trans 'Your question… (Enter to send)' %}"
        class="w-full resize-none rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-950 focus:outline-none focus:ring-2 focus:ring-sky-400"
        @keydown.enter.prevent="if (!$event.shiftKey) { send(); }"
      ></textarea>
      <p class="mt-1 text-[10px] text-slate-400 dark:text-slate-600">{% trans "Enter ↵ to send · Shift+Enter for new line" %}</p>
    </div>
  </div>
</div>
<script>
  function loanwiseChat(appId) {
    return {
      open: false,
      busy: false,
      input: '',
      /* Conversation history sent to the backend on every message.
         Each entry: { role: "user"|"assistant", content: "plain text" }
         Capped at the last 20 messages (10 exchanges) to avoid token overflow. */
      history: [],

      getCookie(name) {
        const v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
        return v ? decodeURIComponent(v[2]) : '';
      },

      /* lightweight markdown → html (bold, italic, inline-code, bullet lists, newlines) */
      mdToHtml(text) {
        if (!text) return '';
        let s = text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
        /* fenced code blocks */
        s = s.replace(/```[\w]*\n?([\s\S]*?)```/g, function (_, c) {
          return '<pre class="mt-1 rounded bg-slate-800 p-2 font-mono text-xs text-emerald-300 overflow-x-auto whitespace-pre-wrap">' + c.trim() + '</pre>';
        });
        /* inline code */
        s = s.replace(/`([^`]+)`/g, '<code class="rounded bg-slate-100 dark:bg-slate-800 px-1 font-mono text-xs">$1</code>');
        /* bold */
        s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        /* italic */
        s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
        /* headings */
        s = s.replace(/^### (.+)$/gm, '<p class="mt-2 font-semibold text-slate-800 dark:text-slate-200">$1</p>');
        s = s.replace(/^## (.+)$/gm, '<p class="mt-2 font-bold text-slate-800 dark:text-slate-100">$1</p>');
        /* bullet lists: convert consecutive lines starting with - or * */
        s = s.replace(/((?:^[ \t]*[-*][ \t].+(?:\n|$))+)/gm, function (block) {
          const items = block.trim().split('\n').map(function (line) {
            return '<li>' + line.replace(/^[ \t]*[-*][ \t]/, '') + '</li>';
          }).join('');
          return '<ul class="mt-1 list-disc pl-4 space-y-0.5">' + items + '</ul>';
        });
        /* numbered lists */
        s = s.replace(/((?:^[ \t]*\d+\.[ \t].+(?:\n|$))+)/gm, function (block) {
          const items = block.trim().split('\n').map(function (line) {
            return '<li>' + line.replace(/^[ \t]*\d+\.[ \t]/, '') + '</li>';
          }).join('');
          return '<ol class="mt-1 list-decimal pl-4 space-y-0.5">' + items + '</ol>';
        });
        /* paragraph breaks */
        s = s.replace(/\n{2,}/g, '</p><p class="mt-2">');
        /* single newline */
        s = s.replace(/\n/g, '<br>');
        return s;
      },

      addMessage(who, text, isHtml) {
        const wrap = this.$refs.messages;
        if (!wrap) return;
        const div = document.createElement('div');
        if (who === 'me') {
          div.className = 'flex justify-end';
          div.innerHTML = '<div class="max-w-[85%] rounded-2xl rounded-br-sm bg-sky-600 px-3 py-2 text-sm text-white">' +
            (isHtml ? text : text.replace(/&/g,'&amp;').replace(/</g,'&lt;')) + '</div>';
        } else {
          div.className = 'flex justify-start';
          div.innerHTML = '<div class="max-w-[88%] rounded-2xl rounded-bl-sm bg-slate-100 dark:bg-slate-800 px-3 py-2 text-sm text-slate-800 dark:text-slate-100 leading-relaxed">' +
            (isHtml ? text : text.replace(/&/g,'&amp;').replace(/</g,'&lt;')) + '</div>';
        }
        wrap.appendChild(div);
        wrap.scrollTop = wrap.scrollHeight;
      },

      init() {
        const wrap = this.$refs.messages;
        if (wrap && !wrap.hasChildNodes()) {
          this.addMessage('ai', '{% filter escapejs %}{% trans "Hello! How can I help you with your loan application?" %}{% endfilter %}', false);
        }
        /* Connection warm-up: fire a silent background request to establish the
           TCP/TLS connection to OpenAI so the user's first real message is fast. */
        this._warmUp();
      },

      _warmUp() {
        try {
          const body = { message: '.', page_context: '{{ lw_chat_page_context|default:"home" }}' };
          if (appId !== null && appId !== undefined && appId !== '') body.application_id = appId;
          fetch('/api/assistant/chat/stream/', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': this.getCookie('csrftoken'),
            },
            body: JSON.stringify(body),
          }).then(function(r) {
            /* Cancel immediately — we only needed the connection, not the response. */
            if (r.body) r.body.cancel();
          }).catch(function() {});
        } catch (_) {}
      },

      /* Create an empty AI bubble and return its inner content div for live updates */
      createStreamBubble() {
        const wrap = this.$refs.messages;
        if (!wrap) return null;
        const div = document.createElement('div');
        div.className = 'flex justify-start';
        div.id = 'lw-stream-bubble';
        const inner = document.createElement('div');
        inner.className = 'max-w-[88%] rounded-2xl rounded-bl-sm bg-slate-100 dark:bg-slate-800 px-3 py-2 text-sm text-slate-800 dark:text-slate-100 leading-relaxed';
        div.appendChild(inner);
        wrap.appendChild(div);
        wrap.scrollTop = wrap.scrollHeight;
        return inner;
      },

      async send() {
        const q = (this.input || '').trim();
        if (!q || this.busy) return;
        this.busy = true;
        this.addMessage('me', q, false);
        this.input = '';
        const wrap = this.$refs.messages;
        /* typing indicator shown until first token arrives */
        const typing = document.createElement('div');
        typing.className = 'flex justify-start';
        typing.id = 'lw-typing';
        typing.innerHTML = '<div class="rounded-2xl bg-slate-100 dark:bg-slate-800 px-3 py-2 text-xs text-slate-500 italic">{% filter escapejs %}{% trans "Typing…" %}{% endfilter %}</div>';
        if (wrap) { wrap.appendChild(typing); wrap.scrollTop = wrap.scrollHeight; }
        try {
          const body = {
            message: q,
            page_context: '{{ lw_chat_page_context|default:"home" }}',
            history: this.history.slice(-20),
          };
          if (appId !== null && appId !== undefined && appId !== '') body.application_id = appId;
          const res = await fetch('/api/assistant/chat/stream/', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': this.getCookie('csrftoken'),
            },
            body: JSON.stringify(body),
          });
          if (!res.ok || !res.body) {
            /* Fallback: read as JSON */
            const data = await res.json().catch(function () { return {}; });
            const reply = data.reply || data.detail || data.error || ('HTTP ' + res.status);
            if (wrap) { const t = document.getElementById('lw-typing'); if (t) t.remove(); }
            this.addMessage('ai', this.mdToHtml(String(reply)), true);
            this.history.push({ role: 'user', content: q });
            this.history.push({ role: 'assistant', content: String(reply) });
            return;
          }
          /* Streaming: read tokens via ReadableStream */
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let accumulated = '';
          let bubble = null;
          let buffer = '';
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const parts = buffer.split('\n\n');
            buffer = parts.pop(); /* keep incomplete last chunk */
            for (const part of parts) {
              if (!part.startsWith('data: ')) continue;
              const payload = part.slice(6).trim();
              if (payload === '[DONE]') break;
              try {
                const parsed = JSON.parse(payload);
                if (parsed && parsed.error) {
                  if (wrap) { const t = document.getElementById('lw-typing'); if (t) t.remove(); }
                  if (bubble) bubble.parentNode && bubble.parentNode.remove();
                  this.addMessage('ai', '{% filter escapejs %}{% trans "Network error. Please try again." %}{% endfilter %}', false);
                  return;
                }
                const token = typeof parsed === 'string' ? parsed : '';
                if (token) {
                  /* Remove typing indicator and create bubble on first token */
                  if (!bubble) {
                    if (wrap) { const t = document.getElementById('lw-typing'); if (t) t.remove(); }
                    bubble = this.createStreamBubble();
                  }
                  accumulated += token;
                  if (bubble) {
                    bubble.innerHTML = this.mdToHtml(accumulated);
                    if (wrap) wrap.scrollTop = wrap.scrollHeight;
                  }
                }
              } catch (_) {}
            }
          }
          if (!bubble) {
            /* No tokens received at all */
            if (wrap) { const t = document.getElementById('lw-typing'); if (t) t.remove(); }
            this.addMessage('ai', '{% filter escapejs %}{% trans "Network error. Please try again." %}{% endfilter %}', false);
          }
          /* Save exchange in history */
          this.history.push({ role: 'user', content: q });
          this.history.push({ role: 'assistant', content: accumulated });
        } catch (e) {
          if (wrap) { const t = document.getElementById('lw-typing'); if (t) t.remove(); }
          this.addMessage('ai', '{% filter escapejs %}{% trans "Network error. Please try again." %}{% endfilter %}', false);
        } finally {
          this.busy = false;
        }
      },
    };
  }
</script>
